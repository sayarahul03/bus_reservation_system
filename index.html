<header class="hero"><h1>Find your bus. Book your seat.</h1><p>Search routes by city and date.</p></header>
<section class="search-card"><form id="searchForm"><div class="row">
<div><label for="source">From</label><input id="source" name="source" placeholder="e.g. Kurnool"></div>
<div><label for="destination">To</label><input id="destination" name="destination" placeholder="e.g. Hyderabad"></div>
<div><label for="date">Date</label><input id="date" name="date" type="date"></div></div>
<button class="btn" type="submit">Search buses</button></form></section>
<main><h1>How it works</h1><p class="sub">Search a route, pick a bus, enter passenger details, and get your booking ID.</p></main>
